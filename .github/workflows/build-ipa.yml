name: Build unsigned IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Fetch pinned emulator core
        run: scripts/fetch_core.sh

      - name: Build interpreter-only arm64 core
        run: scripts/build_core.sh

      - name: Build unsigned application
        run: |
          xcodebuild \
            -project Win95iOS.xcodeproj \
            -scheme Win95iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Win95iOS.app build/Payload/
          cd build
          /usr/bin/zip -qry Win95iOS-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Win95iOS-unsigned
          path: build/Win95iOS-unsigned.ipa
          if-no-files-found: error

