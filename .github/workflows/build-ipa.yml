name: Build unsigned IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      app_name:
        description: Home screen app name
        required: false
        default: Windows 9x
        type: string
      bundle_id:
        description: Bundle identifier
        required: false
        default: jp.example.Win95iOS
        type: string
      icon_url:
        description: Optional HTTPS URL of a square 1024px+ PNG/JPEG icon
        required: false
        type: string
      guest_profile:
        description: Guest OS compatibility/performance profile
        required: true
        default: windows95
        type: choice
        options:
          - windows95
          - windows98
          - windowsme
      hdd_image_url:
        description: Optional direct HTTPS URL of your legally owned, uncompressed IMG/VHD HDD
        required: false
        type: string
      hdd_image_format:
        description: Bundled HDD format (auto recognizes a VHD footer; otherwise raw IMG)
        required: true
        default: auto
        type: choice
        options:
          - auto
          - img
          - vhd
      hdd_image_sha256:
        description: Optional SHA-256 of the HDD download
        required: false
        type: string
      hdd_save_url:
        description: Optional direct HTTPS URL of the matching FFDD .sav overlay
        required: false
        type: string
      hdd_save_sha256:
        description: Optional SHA-256 of the .sav download
        required: false
        type: string

permissions:
  contents: read

jobs:
  storage-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned emulator core
        run: scripts/fetch_core.sh
      - name: Test audio, Win9x CPU, persistence and three simultaneous ATAPI CD drives
        run: bash scripts/test_core_storage.sh
      - name: Test optional bundled IMG, VHD and FFDD save preparation
        run: bash scripts/test_bundled_disk.sh

  build:
    needs: storage-tests
    runs-on: macos-15
    timeout-minutes: 120
    env:
      APP_DISPLAY_NAME: ${{ inputs.app_name || 'Windows 9x' }}
      APP_BUNDLE_ID: ${{ inputs.bundle_id || 'jp.example.Win95iOS' }}
      CUSTOM_ICON_URL: ${{ inputs.icon_url || '' }}
      GUEST_PROFILE: ${{ inputs.guest_profile || 'windows95' }}
      HDD_IMAGE_URL: ${{ inputs.hdd_image_url || '' }}
      HDD_IMAGE_FORMAT: ${{ inputs.hdd_image_format || 'auto' }}
      HDD_IMAGE_SHA256: ${{ inputs.hdd_image_sha256 || '' }}
      HDD_SAVE_URL: ${{ inputs.hdd_save_url || '' }}
      HDD_SAVE_SHA256: ${{ inputs.hdd_save_sha256 || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Fetch pinned emulator core
        run: scripts/fetch_core.sh

      - name: Build interpreter-only arm64 core
        run: scripts/build_core.sh

      - name: Fetch verified iOS user-mode networking runtime
        run: scripts/fetch_network_runtime.sh

      - name: Validate build customization
        run: |
          if [[ -z "$APP_DISPLAY_NAME" || ${#APP_DISPLAY_NAME} -gt 50 ]]; then
            echo "App name must contain 1 to 50 characters." >&2
            exit 1
          fi
          if [[ ! "$APP_BUNDLE_ID" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]]; then
            echo "Invalid bundle identifier: $APP_BUNDLE_ID" >&2
            exit 1
          fi
          if [[ -n "$CUSTOM_ICON_URL" && ! "$CUSTOM_ICON_URL" =~ ^https:// ]]; then
            echo "Custom icon URL must use HTTPS." >&2
            exit 1
          fi
          if [[ -n "$HDD_IMAGE_URL" && ! "$HDD_IMAGE_URL" =~ ^https:// ]]; then
            echo "HDD image URL must use HTTPS." >&2
            exit 1
          fi
          if [[ -n "$HDD_IMAGE_SHA256" && ! "$HDD_IMAGE_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo "HDD image SHA-256 must contain exactly 64 hexadecimal characters." >&2
            exit 1
          fi
          if [[ -n "$HDD_SAVE_URL" && ! "$HDD_SAVE_URL" =~ ^https:// ]]; then
            echo "HDD save URL must use HTTPS." >&2
            exit 1
          fi
          if [[ -n "$HDD_SAVE_SHA256" && ! "$HDD_SAVE_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo "HDD save SHA-256 must contain exactly 64 hexadecimal characters." >&2
            exit 1
          fi
          if [[ -n "$HDD_SAVE_URL" && -z "$HDD_IMAGE_URL" ]]; then
            echo "A bundled .sav requires its matching hdd_image_url." >&2
            exit 1
          fi
          if [[ -n "$HDD_SAVE_SHA256" && -z "$HDD_SAVE_URL" ]]; then
            echo "hdd_save_sha256 requires hdd_save_url." >&2
            exit 1
          fi
          case "$GUEST_PROFILE" in
            windows95|windows98|windowsme) echo "WIN9X_CPU_CYCLES=120000" >> "$GITHUB_ENV" ;;
            *) echo "Unknown guest profile: $GUEST_PROFILE" >&2; exit 1 ;;
          esac

      - name: Prepare custom app icon
        if: ${{ env.CUSTOM_ICON_URL != '' }}
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --max-time 60 --max-filesize 20971520 \
            --output "$RUNNER_TEMP/custom-app-icon" "$CUSTOM_ICON_URL"
          scripts/prepare_app_icon.sh "$RUNNER_TEMP/custom-app-icon"

      - name: Download and validate optional bundled HDD
        if: ${{ env.HDD_IMAGE_URL != '' }}
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --retry 3 --max-time 1800 --max-filesize 4294967296 \
            --output "$RUNNER_TEMP/win9x-base-disk" "$HDD_IMAGE_URL"
          if [[ -n "$HDD_IMAGE_SHA256" ]]; then
            actual_sha="$(shasum -a 256 "$RUNNER_TEMP/win9x-base-disk" | awk '{print $1}')"
            expected_sha="$(printf '%s' "$HDD_IMAGE_SHA256" | tr '[:upper:]' '[:lower:]')"
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "HDD image SHA-256 mismatch." >&2
              exit 1
            fi
          fi
          scripts/prepare_bundled_disk.sh "$RUNNER_TEMP/win9x-base-disk" "$HDD_IMAGE_FORMAT"

      - name: Download and validate optional bundled HDD save
        if: ${{ env.HDD_SAVE_URL != '' }}
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --retry 3 --max-time 1800 --max-filesize 4294967295 \
            --output "$RUNNER_TEMP/win9x-base-save" "$HDD_SAVE_URL"
          if [[ -n "$HDD_SAVE_SHA256" ]]; then
            actual_sha="$(shasum -a 256 "$RUNNER_TEMP/win9x-base-save" | awk '{print $1}')"
            expected_sha="$(printf '%s' "$HDD_SAVE_SHA256" | tr '[:upper:]' '[:lower:]')"
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "HDD save SHA-256 mismatch." >&2
              exit 1
            fi
          fi
          scripts/prepare_bundled_save.sh "$RUNNER_TEMP/win9x-base-save"

      - name: Build unsigned application
        run: |
          build_settings=(
            "APP_DISPLAY_NAME=$APP_DISPLAY_NAME"
            "PRODUCT_BUNDLE_IDENTIFIER=$APP_BUNDLE_ID"
            "WIN9X_CPU_CYCLES=$WIN9X_CPU_CYCLES"
          )
          if [[ -n "$CUSTOM_ICON_URL" ]]; then
            build_settings+=("ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon")
          fi
          xcodebuild \
            -project Win95iOS.xcodeproj \
            -scheme Win95iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            "${build_settings[@]}" \
            build

      - name: Package IPA
        run: |
          for framework in slirp.0 glib-2.0.0 iconv.2 intl.8; do
            test -f "build/DerivedData/Build/Products/Release-iphoneos/Win95iOS.app/Frameworks/$framework.framework/$framework"
          done
          if [[ -n "$HDD_IMAGE_URL" ]]; then
            find build/DerivedData/Build/Products/Release-iphoneos/Win95iOS.app/BundledContent \
              -maxdepth 1 -type f \( -name 'win-base.img' -o -name 'win-base.vhd' \) | grep -q .
          fi
          if [[ -n "$HDD_SAVE_URL" ]]; then
            test -f build/DerivedData/Build/Products/Release-iphoneos/Win95iOS.app/BundledContent/win-base-CDRIVE.sav
          fi
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Win95iOS.app build/Payload/
          cd build
          /usr/bin/zip -qry Win95iOS-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Win95iOS-unsigned
          path: build/Win95iOS-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
