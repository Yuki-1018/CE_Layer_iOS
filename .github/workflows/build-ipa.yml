name: Build unsigned IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      app_name:
        description: Home screen app name
        required: false
        default: Windows 95
        type: string
      bundle_id:
        description: Bundle identifier
        required: false
        default: jp.example.Win95iOS
        type: string
      icon_url:
        description: Optional HTTPS URL of a square 1024px+ PNG/JPEG icon
        required: false
        type: string

permissions:
  contents: read

jobs:
  storage-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned emulator core
        run: scripts/fetch_core.sh
      - name: Test disk persistence and live ATAPI media changes
        run: bash scripts/test_core_storage.sh

  build:
    needs: storage-tests
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_DISPLAY_NAME: ${{ inputs.app_name || 'Windows 95' }}
      APP_BUNDLE_ID: ${{ inputs.bundle_id || 'jp.example.Win95iOS' }}
      CUSTOM_ICON_URL: ${{ inputs.icon_url || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Fetch pinned emulator core
        run: scripts/fetch_core.sh

      - name: Build interpreter-only arm64 core
        run: scripts/build_core.sh

      - name: Validate build customization
        run: |
          if [[ -z "$APP_DISPLAY_NAME" || ${#APP_DISPLAY_NAME} -gt 50 ]]; then
            echo "App name must contain 1 to 50 characters." >&2
            exit 1
          fi
          if [[ ! "$APP_BUNDLE_ID" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]]; then
            echo "Invalid bundle identifier: $APP_BUNDLE_ID" >&2
            exit 1
          fi
          if [[ -n "$CUSTOM_ICON_URL" && ! "$CUSTOM_ICON_URL" =~ ^https:// ]]; then
            echo "Custom icon URL must use HTTPS." >&2
            exit 1
          fi

      - name: Prepare custom app icon
        if: ${{ env.CUSTOM_ICON_URL != '' }}
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --max-time 60 --max-filesize 20971520 \
            --output "$RUNNER_TEMP/custom-app-icon" "$CUSTOM_ICON_URL"
          scripts/prepare_app_icon.sh "$RUNNER_TEMP/custom-app-icon"

      - name: Build unsigned application
        run: |
          build_settings=(
            "APP_DISPLAY_NAME=$APP_DISPLAY_NAME"
            "PRODUCT_BUNDLE_IDENTIFIER=$APP_BUNDLE_ID"
          )
          if [[ -n "$CUSTOM_ICON_URL" ]]; then
            build_settings+=("ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon")
          fi
          xcodebuild \
            -project Win95iOS.xcodeproj \
            -scheme Win95iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            "${build_settings[@]}" \
            build

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Win95iOS.app build/Payload/
          cd build
          /usr/bin/zip -qry Win95iOS-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Win95iOS-unsigned
          path: build/Win95iOS-unsigned.ipa
          if-no-files-found: error
